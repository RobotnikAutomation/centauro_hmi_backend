centauro_hmi_backend:
  ros__parameters:
    robot.type: real # options: real, mock
    websocket_host: 127.0.0.1
    websocket_port: 8765
    websocket_ping_timeout_sec: 1800.0
    telemetry_hz: 20.0
    base_cmd_vel_hz: 100.0
    command_timeout_sec: 0.5
    initial_speed_percentage: 25.0
    robot.joint_states_topic: /robot/joint_states
    robot.base_cmd_vel_topic: /robot/pad_teleop/cmd_vel
    robot.teleoperation_node_name: /robot/robot/arm_teleoperation_node
    robot.image_streams:
      - front_camera=/robot/front_rgbd_camera/color/image_raw
    robot.battery_topic: /robot/battery_estimator/data
    robot.base_status_topic: /robot/robotnik_base_hw_monitor/status
    robot.robot_mode_topic: /robot/arm/io_and_status_controller/robot_mode
    robot.robot_program_running_topic: /robot/arm/io_and_status_controller/robot_program_running
    robot.safety_mode_topic: /robot/arm/io_and_status_controller/safety_mode
    robot.tool_data_topic: /robot/arm/io_and_status_controller/tool_data
    robot.safety_module_status_topic: /robot/safety_module/status
    log_stats_period_sec: 5.0
    log_payloads: true
    log_payload_max_chars: 180
    robot_model_max_size_bytes: 52428800
    robot_model_chunk_size: 65536
    ik.target_frame: hmi_tcp_target
    ik.tcp_frame: robot_arm_tool0
    ik.base_frame: robot_arm_base_link
    ik.namespace: robot
